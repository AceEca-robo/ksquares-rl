# Round robin for scripts/eval_ladder.py: every pair plays `games` games on
# `board`, the first mover alternating.
seed: 777
games: 200
board: [5, 5]
processes: 16
agents: [random, greedy, easy, medium, hard, strong]
params:              # constructor parameters per agent (agents/registry.py)
  strong:
    time_limit: 0.5  # seconds per move (wall clock)
