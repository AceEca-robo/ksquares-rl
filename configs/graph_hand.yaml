# Part 4, stage 0 and experiment (i) of docs/plan_part4.md (scripts/graph_hand.py).
seed: 4100
device: cuda
out: runs/graph_hand2            # stage 0 rounds 3-4; first rounds: runs/graph_hand; (i) curriculum: --out runs/graph_hand3
optim: {clip: 1.0, cosine: true, keep_best: true}   # all arms, stage 0 and (i); user, 2026-11-07
parity_config: configs/parity_hand.yaml   # judge sets, their split and the probe sets

limits:                          # overnight limits of the user, 2026-11-07
  gpu_memory_fraction: 0.4       # GPU load is not limited
  min_available_gb: 12           # training waits below this
  cpu_threads: 2

arms:
  C:
    net: {arch: dot2, blocks: 6, channels: 64, gpool_blocks: [2, 4], head_channels: 32, score_head: true}
  Ch:
    net: {arch: dot2, blocks: 6, channels: 64, gpool_blocks: [2, 4], head_channels: 32, score_head: true, planes: 17}
  Ga: {config: configs/graph_ga.yaml}
  Gc: {config: configs/graph_gc.yaml}
  Gc16: {config: configs/graph_gc16.yaml}

stage0:
  runs:                          # earlier runs (6000 steps, Gc / Ga / C, both sizes; Gc 10x7 only): docs/overnight.md
    alt: {arm: Gc, train_sizes: [5x5, 10x7]}                     # (a) does 10x7 click after 5x5?
    curr: {arm: Gc, train_sizes: [5x5, 10x7], curriculum: true}   # (b) 5x5 until 95%, then 10x7 only
    curr_r: {arm: Gc, train_sizes: [5x5, 10x7], curriculum: true}  # (b) again, keeps the final net
    mixft: {arm: Gc, train_sizes: [5x5, 10x7], init: stage0_curr_r_final.pt, lr_scale: 0.1, steps: 5000}  # both sizes?
    # reproducibility of (b): fixed switch at 5500, deterministic kernels, 5 seeds (user, 2026-11-08)
    det_s1: {arm: Gc, train_sizes: [5x5, 10x7], curriculum: true, switch_at: 5500, deterministic: true, seed: 1}
    det_s2: {arm: Gc, train_sizes: [5x5, 10x7], curriculum: true, switch_at: 5500, deterministic: true, seed: 2}
    det_s3: {arm: Gc, train_sizes: [5x5, 10x7], curriculum: true, switch_at: 5500, deterministic: true, seed: 3}
    det_s4: {arm: Gc, train_sizes: [5x5, 10x7], curriculum: true, switch_at: 5500, deterministic: true, seed: 4}
    det_s5: {arm: Gc, train_sizes: [5x5, 10x7], curriculum: true, switch_at: 5500, deterministic: true, seed: 5}
    deep: {arm: Gc16, train_sizes: [10x7]}                        # (c) range: 16 layers (first round only)
  n_train: 20000                 # per size, random safe-move playouts
  n_val: 2000
  steps: 20000
  batch: 128
  lr: 0.0005
  log_every: 500
  pass_acc: 95.0                 # best point, both sizes; also the curriculum switch on 5x5
  hold_acc: 90.0                 # both sizes, every log from the first pass to the end

train:
  arms: [C, Ch, Ga, Gc]
  curriculum: {5x5: 5500}        # as stage 0 (b): judge 5x5 positions only, then 10x7 only (user, 2026-11-07)
  select_on: 10x7                # best point by 10x7 validation
  seeds: [1, 2, 3]
  steps: 30000                   # 18000 (3 x the 6000 that sufficed on 5x5) if stage 0 fails, --steps
  batch: 128                     # sizes alternate
  lr: 0.0005
  log_every: 2500
