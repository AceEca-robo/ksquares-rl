# The desktop app (scripts/launcher.py, launcher/).
best:
  run_config: configs/az5b.yaml   # runs/best/best.pt -> its last accepted generation...
  gen: 54                         # ...unless pinned: az5b gen 54, the ladder best (MCTS Elo 2164)
  dir: runs/best
  download:                       # what the app fetches when runs/best/best.pt is missing (a fresh clone)
    url: https://github.com/AceEca-robo/ksquares-rl/releases/download/v0.1/best.pt
    sha256: fbf37b1d3848db8401d8557f33d60f54faaf44ee1cec6bebd767ed68f44e304b
    size: 2207519
    run: az5b                     # what it is: az5b gen 54
    gen: 54
best_sizes:                       # the best network per other board size ("WxH"), as best (no download)
  10x7:
    run_config: configs/dot2c.yaml  # Dot-2, curriculum 5x5 -> 7x7 -> 10x7
    gen: 16                         # pinned: MCTS Elo 1755 on the 10x7 ladder (docs/dot2c_ladder.md)
    dir: runs/best10x7
    download:                       # fetched with best's when runs/best10x7/best.pt is missing
      url: https://github.com/AceEca-robo/ksquares-rl/releases/download/v0.2/best10x7.pt
      sha256: 071d2a05e919357efb7fcba402d0e8b3c8692075fb7fffebf843235b928dde3b
      size: 2083639
      run: dot2c
      gen: 16
release_generations:              # more release networks, fetched with the best ones; listed in the menus
  - config: configs/dot2s.yaml    # Dot-2 from scratch on 10x7, the run's best (12-8 vs the real Hard)
    dir: runs/release
    file: dot2s_gen_0039.pt
    download:
      url: https://github.com/AceEca-robo/ksquares-rl/releases/download/v0.2/dot2s_gen_0039.pt
      sha256: b86925a58110a1f6634946adf9703b705181626400de3e79fe86e55e1d5b22dd
      size: 2083639
      run: dot2s
      gen: 39
generations:                      # pickable in "network vs itself" (the menu shows those of the board size)
  - configs/az5.yaml
  - configs/az5b.yaml
  - configs/dot2a.yaml            # Dot-2 on 5x5
  - configs/dot2c.yaml            # Dot-2 on 10x7: curriculum
  - configs/dot2s.yaml            # Dot-2 on 10x7: from scratch
board_sizes: [[5, 5], [10, 7]]
sims_choices: [0, 50, 200, 800]   # 0 = no search, the policy's argmax
sims_default: 200
device: auto                      # cuda if available
ai_delay_ms: 700                  # KSquares' own player waits this long per line
net_delay: 0.6                    # seconds the network's move stays shown before it is drawn
human_review: 1.5                 # seconds the network's view of your move stays before it replies
selfplay_delays: [0.1, 0.3, 0.6, 1.2, 2.5]   # "network vs itself" speeds, seconds per move
selfplay_delay_default: 2         # index into selfplay_delays
pv_len: 10                        # principal variation drawn on the board
solver:                           # "the network sees / does not see" verdicts
  max_undrawn: 34                 # exact solving only from here (the chain fight)
  node_limit: 150000              # per position; bigger ones get no verdict
  sizes:                          # per board "WxH", overrides of the above (launcher/brain.py solver_params)
    10x7: {max_undrawn: null, node_limit: null, time_limit: 1.0}   # covers ~50% of a game
                                  # (docs/judge_coverage.md; max_undrawn 34 would be the last 22%)
xvfb_size: [1024, 900]
ksquares_window: [760, 800]
record_fps: 20
train:                            # "Train your own Dot" (launcher/train.py)
  base_config: configs/az5b.yaml  # copied to runs/<name>/train.yaml: run_dir, from scratch, no docs
  base_configs:                   # per board "WxH" picked in the menu, overrides base_config
    10x7: configs/dot2s.yaml      # Dot-2 from scratch on 10x7 (rounds take ~1 h on an RTX 4060)
  default_name: my_dot
  rounds_choices: [5, 10, 25, 50, 0]   # 0 = until stopped
  rounds_default: 10
  cpu_slowdown: 10                # what the app says about training without a GPU
  min_vram_gb: 4
  min_disk_gb: 1                  # az5b: 182 MB after 87 rounds (buffer, checkpoints, logs)
  round_minutes_gpu: 11           # RTX 4060 Laptop, az5b median: the forecast before the first round
  stale_s: 60                     # no new line in train.log / progress.jsonl for this long: the yellow warning
