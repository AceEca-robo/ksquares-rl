# Dot-2 on 5x5, step (a) of docs/plan_part2.md: the size-independent net
# (agents/az_net.py AZNet2), body from Dot (az5b gen 54) distilled from Dot
# (scripts/distill.py), then AlphaZero as az5b.
seed: 2810
board: [5, 5]
run_dir: runs/dot2a
init_from: runs/dot2_distill/student.pt   # scripts/distill.py
device: cuda
probes: false            # az_eval.py: no docs/probes snapshots (5x5 Dot scripts)
update_best: false       # az_eval.py: runs/best (the app's net) stays Dot

net:
  arch: dot2             # AZNet2: convolutional heads, global pooling
  gpool_blocks: [2, 4]   # residual blocks with a pooled-board bias
  head_channels: 32
  blocks: 6
  channels: 64
  score_head: true       # second value head: final score difference / boxes

mcts:
  c_puct: 1.5
  fpu_reduction: 0.2     # unvisited child Q = parent net value - this
  dirichlet_alpha: 0.3   # root noise in self-play only
  dirichlet_eps: 0.25
  virtual_loss: 1.0
  leaves_per_tree: 8     # for single-game search (az agent); self-play uses 1

selfplay:
  workers: 3             # processes, each with its own CUDA context (~160 MB)
  games_per_worker: 192  # concurrent games per worker = GPU batch size;
                         # lower it if the GPU runs out of memory
  games_per_gen: 2500    # ~10.4k evaluations per game; ~25 min at ~17k/s
                         # with the GPU shared (6000 games took 65 min)
  sims: [100, 300]      # drawn uniformly per game and move
  temp_moves: 10         # temperature 1 for the first 10 lines, then 0

buffer_size: 500000      # positions (the last ones)

train:
  batch_size: 512
  steps_per_gen: 1100   # ~4 samples per new position
  lr: 0.01               # half of az5
  momentum: 0.9
  weight_decay: 0.0001   # L2
  score_weight: 0.25     # weight of the score-difference MSE
  symmetries: true       # random one of the 8 board symmetries per sample
  min_buffer: 20000      # do not train before this many positions

stop:                    # scripts/az_train.py stops the run when
  max_rejects: 6         # this many generations in a row were rejected, or
  elo: 2100              # an accepted generation reaches this MCTS ladder Elo
  hard: 0.90             # and this win share vs hard (MCTS, az_eval.py)

gating:
  games: 100
  sims: 200
  temp_moves: 4          # some opening variety; no noise
  tasks: 2               # games split over this many worker tasks
  threshold: 0.55

eval:
  games: 100             # per opponent and mode, first mover alternating
  sims: 200
  opponents: [random, greedy, medium, hard, strong]  # random: Elo floor
  processes: 8           # CPU workers for the opponents' moves
  params:
    strong:
      node_budget: 23000 # = 0.5 s of one core (scripts/calibrate_strong.py:
                         # median 46k nodes per CPU second), not wall clock

bridge_eval:             # scripts/az_vs_hard.py: vs the real game's Hard
  games: 20              # as for Dot (18/20)
  sims: 200
  seed: 11
