# scripts/sims_vs_hard.py: how strong is the app's 10x7 network (dot2c gen 16,
# runs/best10x7) against Hard in the simulator at each "Search" button of the app
base: configs/dot2c.yaml       # the net's architecture, board, mcts and eval settings
checkpoint: runs/best10x7/best.pt
sims: [50, 100, 200, 400]
games: 100                     # per sims value, the first mover alternating
opponent: hard
seed: 2026
out: docs/sims_vs_hard_10x7.json
