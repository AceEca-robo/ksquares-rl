# Russian cut of the part 3 video (docs/video_script_part3_ru.md).
#
#   .venv/bin/python video/video_build.py --storyboard video/storyboard_part3_ru.yaml \
#       --script docs/video_script_part3_ru.md --out video/p3/ksquares_rl_part3_ru.mp4 \
#       --srt video/p3/ksquares_rl_part3_ru.srt --build video/build_p3_ru
#
# Format as storyboard_ru.yaml (part 1). Cuts sit on the sentence starts of
# the scene's voice (video_anim.sentence_starts on video/p3/voice_ru_<N>.mp3).
# Materials: every p3/card_*.png, p3/game121_ru.mp4, p3/two_boards.mp4, p3/conv_window.mp4, p3/menu_10x7_200_ru.png
# (docs/video_script_part3_ru.md, "Что нужно снять"). Voice: video/p3/voice_ru_<N>.mp3.

size: [1920, 1080]
fps: 25
crf: 18
voice_at: 0.5
min_tail: 0.7
fade: 0.4
title:
  seconds: 3
  image: p3/card_title.png
end:
  seconds: 6
  lines: ["github.com/AceEca-robo/ksquares-rl", "",
          "KSquares 21.12.3 © Matt Williams et al., GPL-2+"]

scenes:
  - n: 1
    title: "Вопрос"
    voice: p3/voice_ru_1.mp3
    fragments:
      - {file: p3/two_boards.mp4, seconds: 26.1, speed: 0.91}   # В прошлый раз мы настроили интуицию
      - {file: p3/card_chains.png, seconds: 14.7}   # В конце партии доска разрезана
      - {file: p3/card_question.png, seconds: 13.4}   # Вот наш вопрос
      - {file: p3/game121_end.mp4, seconds: 13.4, caption: "1:69 · 50 вариантов на ход · 17 разгромов из 190"}   # И это не праздный вопрос

  - n: 2
    title: "Где ошибка"
    voice: p3/voice_ru_2.mp3
    fragments:
      - {file: p3/game121_ru.mp4, seconds: 27.5}   # Вот одна такая партия.
      - {file: p3/card_blowouts.png, seconds: 21.4}   # Мы разобрали разгромы

  - n: 3
    title: "Попытка 1: учитель-судья"
    voice: p3/voice_ru_3.mp3
    fragments:
      - {file: p3/card_teacher.png, seconds: 20.0, caption: "позиции с 1–2 безопасными линиями"}   # План простой
      - {file: p3/card_timeline.png, seconds: 21.6}   # Прекрасно.

  - n: 4
    title: "Попытка 2: новая сеть"
    voice: p3/voice_ru_4.mp3
    fragments:
      - {file: p3/conv_window.mp4, seconds: 35.4, speed: 0.73}   # Вторая попытка: изменить саму сеть.
      - {file: p3/card_shared_body.png, seconds: 16.0}   # Без размышлений Dot-2 и правда
      - {file: p3/card_frozen.png, seconds: 18.2}   # Разгромов становится вчетверо

  - n: 5
    title: "Попытка 3: судья по формуле"
    voice: p3/voice_ru_5.mp3
    fragments:
      - {file: p3/card_formula.png, seconds: 16.4}   # Может, судья слишком примитивный?
      - {file: p3/card_formula_back.png, seconds: 21.0, caption: "середина партии, 5500 позиций: ответов нет"}   # И когда безопасные линии

  - n: 6
    title: "Попытка 4: сильный судья"
    voice: p3/voice_ru_6.mp3
    fragments:
      - {file: p3/card_tree.png, seconds: 17.6}   # Четвёртая попытка
      - {file: p3/card_wall.png, seconds: 25.8}   # Мы проверили его

  - n: 7
    title: "Кто что знает"
    voice: p3/voice_ru_7.mp3
    fragments:
      - {file: p3/card_map_0.png, seconds: 8.4}   # Зато теперь
      - {file: p3/card_map_1.png, seconds: 7.1}   # Вот Dot-2 без размышлений.
      - {file: p3/card_map_2.png, seconds: 3.5}   # Вот интуиция
      - {file: p3/card_map_3.png, seconds: 11.7}   # Вот Dot-2 с размышлениями
      - {file: p3/card_map_4.png, seconds: 17.8}   # И вот судья.
      - {file: p3/card_map_5.png, seconds: 6.5}   # За этой стеной

  - n: 8
    title: "Попытка 5: на своих ошибках"
    voice: p3/voice_ru_8.mp3
    fragments:
      - {file: p3/funnel.mp4, seconds: 30.1}   # Последняя попытка.
      - {file: p3/card_mistakes_held.png, seconds: 7.8}   # Теперь главная проверка
      - {file: p3/card_mid_held.png, seconds: 13.4}   # Прибавка есть

  - n: 9
    title: "Ответ"
    voice: p3/voice_ru_9.mp3
    fragments:
      - {file: p3/card_map_6.png, seconds: 25.6}   # Итак, ответ.
      - {file: p3/menu_10x7_200_ru.png, seconds: 9.1}   # Поэтому в приложении

  - n: 10
    title: "Что дальше"
    voice: p3/voice_ru_10.mp3
    fragments:
      - {file: p3/card_map_5.png, seconds: 23.6}   # Позади две игры
      - {file: p3/funnel10.mp4, seconds: 23.9}   # Но вспомните, во что обошлись примеры
      - {file: p3/window_graph.mp4, seconds: 31.1}   # Свёрточная смотрит на доску окошком
      - {file: p3/card_end.png, seconds: 13.0}   # Ответ «дорого»
