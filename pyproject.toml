[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ksquares-rl"
version = "0.0.1"
description = "RL agents for KSquares (KDE Dots and Boxes)"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
dependencies = [
    "numpy==2.2.6",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest"]
az = ["torch==2.14.1", "matplotlib==3.10.9"]

[tool.setuptools]
packages = ["sim", "agents", "env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
